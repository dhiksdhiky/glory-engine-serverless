<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Glory Engine</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="mesh-bg">
    <div class="mesh-blob blob-1"></div>
    <div class="mesh-blob blob-2"></div>
    <div class="mesh-blob blob-3"></div>
  </div>

  <div class="app-container">
    <header class="glass-header">
      <div class="header-content">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="header-icon text-accent"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
        <div class="header-titles">
          <h1>Stock Engine</h1>
          <span id="live-clock">--:--</span>
        </div>
      </div>
    </header>
    
    <main class="content-area" id="app-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading market data...</p>
      </div>
    </main>
    
    <!-- Modals -->
    <!-- Upload Modal -->
    <div id="uploadModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;">
      <div class="glass-card" style="width: 90%; max-width: 400px; padding: 24px; position: relative;">
        <button class="close-modal-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h2 style="margin-bottom: 8px; font-size: 1.25rem;">Update Master Data</h2>
        <p class="text-muted" style="margin-bottom: 20px; font-size: 0.85rem">Upload file format .xlsx dari web IDX (Daftar Saham) untuk memperbarui data emiten.</p>
        <form id="uploadForm">
            <div class="dropzone" id="dropzone" style="margin-bottom: 16px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom:8px; color: var(--accent-emerald)"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <h3 id="fileNameDisplay" style="font-size: 0.95rem; margin-bottom:4px;">Pilih File Excel</h3>
                <input type="file" name="file" id="fileInput" accept=".xlsx" style="display: none;" required>
            </div>
            <button type="submit" id="btnUpload" class="btn-primary" style="width: 100%;">Upload & Proses</button>
        </form>
        <div id="uploadStatus" style="margin-top: 16px; font-size: 0.9rem; text-align: center;"></div>
      </div>
    </div>

    <!-- Suspend Info Modal -->
    <div id="suspendModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;">
      <div class="glass-card" style="width: 90%; max-width: 400px; padding: 24px; position: relative; max-height: 80vh; overflow-y: auto;">
        <button class="close-modal-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h2 style="margin-bottom: 16px; font-size: 1.25rem;">Saham Suspensi / Gap IPOT</h2>
        <div id="suspendModalContent" class="gap-list"></div>
      </div>
    </div>

    <!-- Bot Issues Modal -->
    <div id="logsModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;">
      <div class="glass-card" style="width: 90%; max-width: 400px; padding: 24px; position: relative; max-height: 80vh; overflow-y: auto;">
        <button class="close-modal-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h2 style="margin-bottom: 16px; font-size: 1.25rem;">Recent Bot Issues (48h)</h2>
        <div id="logsModalContent"></div>
      </div>
    </div>

    <nav class="glass-bottom-nav">
      <button class="nav-btn active" data-tab="dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Database</span>
      </button>
      <button class="nav-btn" data-tab="candlify" style="opacity: 0.5;">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        <span>Candlify</span>
      </button>
      <button class="nav-btn" data-tab="journal" style="opacity: 0.5;">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        <span>Journal</span>
      </button>
    </nav>
  </div>

  <script src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.log('SW Failed', err));
      });
    }
  </script>
</body>
</html>
