name: Glory Engine Harvester

on:
  schedule:
    # Berjalan tiap jam 11:00 UTC (18:00 WIB), dari Senin sampai Jumat
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Mengizinkan eksekusi manual via tab Actions

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Setup timeout batas maksimal 6 jam
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r worker/requirements.txt
        
    - name: Run Stock Engine (Pipeline + Harvester)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        TELE_BOT_DHIKSDHIKY: ${{ secrets.TELE_BOT_DHIKSDHIKY }}
        TELE_CHAT_ID_DHIKA: ${{ secrets.TELE_CHAT_ID_DHIKA }}
      run: |
        cd worker
        python run.py
